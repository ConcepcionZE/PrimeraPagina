[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexbot"
version = "0.1.0"
description = "24/7 crypto trading agent: code-owned risk, typed REFLEX decisions, paper-first."
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.5",
  "pydantic>=2.7",
  "pyyaml>=6",
  "requests>=2.31",
  "numpy>=1.26",
]

[project.optional-dependencies]
haiku = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
reflexbot = "reflexbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
